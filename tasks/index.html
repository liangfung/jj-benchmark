s a `description`, `isDone` status, and belongs to a `Team`.\n2.  **Authentication**:\n    *   Use `usernameAndPassword` authentication.\n    *   Customize the signup process to include a `fullName` field on the `User` entity.\n3.  **Operations**:\n    *   **Query** `getMyTeams`: Returns all teams the logged-in user belongs to.\n    *   **Action** `createTeam`: Creates a new team and adds the creator as the first member.\n    *   **Action** `createTask`: Creates a task for a specific team. **Constraint**: Only team members can create tasks for that team.\n    *   **Query** `getTeamTasks`: Returns all tasks for a specific team. **Constraint**: Only team members can view tasks for that team.\n4.  **Frontend**:\n    *   A Dashboard page showing the user's teams.\n    *   A Team Detail page (using dynamic routes `/team/:id`) showing tasks and a form to add new tasks.\n    *   Use Wasp's `useQuery` and `useAction` hooks for data fetching and mutations.\n\n## Implementation Guide\n1.  **Project Setup**:\n    *   Initialize a new Wasp project: `wasp new team_manager -t minimal`.\n    *   Base path: `/home/user/team_manager`.\n2.  **Schema Definition**:\n    *   Define `User`, `Team`, and `Task` in `schema.prisma`.\n    *   Ensure proper relations (Many-to-Many between User and Team, One-to-Many between Team and Task).\n3.  **Auth Configuration**:\n    *   In `main.wasp`, configure `auth` with `userSignupFields` to capture `fullName`.\n    *   Implement `userSignupFields` in `src/auth.ts`.\n4.  **Backend Logic**:\n    *   Implement queries and actions in `src/queries.ts` and `src/actions.ts`.\n    *   Use `context.user` to verify identity and `context.entities` for database access.\n    *   Throw `HttpError(403)` if a user tries to access/modify a team they don't belong to.\n5.  **Frontend Implementation**:\n    *   Create `src/pages/Dashboard.tsx` and `src/pages/TeamPage.tsx`.\n    *   Use `wasp/client/operations` to call your queries and actions.\n\n## Constraints\n- Project path: `/home/user/team_manager`\n- Start command: `wasp start`\n- Port: 3000\n- Database: SQLite (default)\n- Use TypeScript for all implementation files.\n"])</script><script>self.__next_f.push([1,"9:Tc20,"])</script><script>self.__next_f.push([1,"# Customizing Wasp Signup with Extra Fields\n\n## Background\nWasp provides a powerful authentication system out of the box. While the default setup handles email/password or social logins, many real-world applications require collecting additional information during registration, such as a user's full name or organization. This task involves extending the Wasp `User` entity and the built-in `SignupForm` to collect and save a `fullName` field.\n\n## Requirements\n- **Database Schema**: Update the `User` entity to include a `fullName` string field.\n- **Backend Logic**: Implement a `userSignupFields` function to process and validate the `fullName` from the signup data.\n- **Frontend UI**: Customize the `SignupForm` component to include a \"Full Name\" input field with basic validation.\n- **Display**: Show the `fullName` of the logged-in user on the main page.\n\n## Implementation Guide\n\n### 1. Project Setup\nInitialize a new Wasp project in `/home/user/my-auth-app`:\n```bash\nwasp new my-auth-app\ncd my-auth-app\n```\n\n### 2. Update Schema (`main.wasp`)\nModify the `User` entity to add `fullName`: \n```wasp\nentity User {\n  id       Int     @id @default(autoincrement())\n  username String  @unique\n  password String\n  fullName String  // Add this field\n}\n```\n\n### 3. Configure Auth (`main.wasp`)\nIn the `auth` section of your `app` declaration, add the `userSignupFields` import:\n```wasp\napp myAuthApp {\n  wasp: { version: \"^0.15.0\" },\n  title: \"My Auth App\",\n  auth: {\n    userEntity: User,\n    methods: { usernameAndPassword: {} },\n    onAuthFailedRedirectTo: \"/login\",\n    userSignupFields: import { userSignupFields } from \"@src/auth/signup.js\"\n  }\n}\n```\n\n### 4. Backend Logic (`src/auth/signup.js`)\nCreate `src/auth/signup.js` and export `userSignupFields`. Use `defineUserSignupFields` to map the incoming data to your entity fields:\n```javascript\nimport { defineUserSignupFields } from 'wasp/server/auth'\n\nexport const userSignupFields = defineUserSignupFields({\n  fullName: (data) =\u003e {\n    if (!data.fullName) {\n      throw new Error('Full name is required')\n    }\n    return data.fullName\n  },\n})\n```\n\n### 5. Frontend UI (`src/SignupPage.jsx`)\nCustomize the `SignupForm` by passing the `additionalFields` prop:\n```javascript\nimport { SignupForm } from 'wasp/client/auth'\n\nexport const SignupPage = () =\u003e {\n  return (\n    \u003cSignupForm\n      additionalFields={[\n        {\n          name: 'fullName',\n          label: 'Full Name',\n          type: 'input',\n          validations: {\n            required: 'Full name is required',\n          },\n        },\n      ]}\n    /\u003e\n  )\n}\n```\nRemember to update `main.wasp` to use this custom `SignupPage` component for the `/signup` route.\n\n### 6. Display User Info (`src/MainPage.jsx`)\nUpdate the `MainPage` to display the user's full name:\n```javascript\nexport const MainPage = ({ user }) =\u003e {\n  return (\n    \u003cdiv\u003e\n      \u003ch1\u003eHello, {user.fullName}!\u003c/h1\u003e\n      {/* ... logout button ... */}\n    \u003c/div\u003e\n  )\n}\n```\n\n## Constraints\n- Project path: `/home/user/my-auth-app`\n- Start command: `wasp start` (Note: You'll need to run `wasp db migrate-dev` first)\n- Port: 3000"])</script><script>self.__next_f.push([1,"a:T8d3,"])</script><script>self.__next_f.push([1,"# Wasp Todo List Application\n\n## Background\nWasp is a declarative DSL for building full-stack web applications using React, Node.js, and Prisma. In this task, you will build a simple, multi-user Todo List application that demonstrates the core features of Wasp: Entities, Operations (Queries \u0026 Actions), and Authentication.\n\n## Requirements\n- **Authentication**:
